project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - example.qmd
    - reference.qmd

website:
  title: PlotCat
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: example.qmd
        text: Example
      - href: reference.qmd
        text: Reference
    tools:
      - icon: github
        href: https://github.com/VisruthSK/plotcat
        aria-label: PlotCat source code
        target: _blank
  repo-url: https://github.com/VisruthSK/plotcat
  repo-actions: [source, issue]
  repo-link-target: _blank

format:
  live-html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    fig-format: svg

    webr:
      packages:
        - svglite
        - ggplot2
        - palmerpenguins
        - tinyplot
        - lattice
        - plotly

    pyodide:
      packages:
        - matplotlib
        - scikit-learn
        - pandas
        - seaborn
        - plotnine
        - plotly

filters:
  - plotcat

execute:
  freeze: auto
